trigger:
  branches:
    include:
      - main

  paths:
    include:
      - infrastructure/workload/**
      - pipelines/workload-cicd.yaml

resources:
  pipelines:
    - pipeline: platform
      source: platform-cicd 
      trigger:
        branches:
          include:
            - main

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Validate
    displayName: Validate workload
    jobs:
      - job: ValidateWorkload
        displayName: Validate workload Terraform
        steps:
          - checkout: self

          - bash: |
              set -e 

              wget -O- https://apt.releases.hashicorp.com/gpg | \
                gpg --dearmor | \
                sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg > /dev/null

              echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | \
                sudo tee /etc/apt/sources.list.d/hashicorp.list

              sudo apt update
              sudo apt install -y terraform
            displayName: Install Terraform
          
          - bash: |
              set -e 

              terraform fmt -check -recursive infrastructure/workload 

              cd infrastructure/workload

              terraform init -backend=false 
              terraform validate 
            displayName: Validate workload Terraform

  - stage: PlanWorkload
    displayName: Plan Workload 
    dependsOn: Validate
    jobs:
      - job: PlanWorkload 
        displayName: Terraform plan workload
        steps: 
          - checkout: self 

          - bash: |
              set -e

              wget -O- https://apt.releases.hashicorp.com/gpg | \
                gpg --dearmor | \
                sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg > /dev/null

              echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | \
                sudo tee /etc/apt/sources.list.d/hashicorp.list

              sudo apt update
              sudo apt install -y terraform
            displayName: Install Terraform

          - task: AzureCLI@2
            displayName: Terraform plan workload
            inputs:
              azureSubscription: sc-cit-azure
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -e 

                cd infrastructure/workload

                terraform init
                terraform plan -out=tfplan
          
          - publish: infrastructure/workload/tfplan
            artifact: workload-plan 
            displayName: Publish workload plan 

  - stage: ApproveWorkload
    displayName: Approve Workload
    dependsOn: PlanWorkload
    jobs:
      - job: WaitForApproval
        displayName: Review workload plan
        pool: server
        steps:
          - task: ManualValidation@1
            inputs:
              notifyUsers: ''
              instructions: 'Review the Terraform workload plan and approve before applying.'
              onTimeout: reject

  - stage: ApplyWorkload
    displayName: Apply Workload
    dependsOn: ApproveWorkload
    jobs:
      - job: ApplyWorkload
        displayName: Terraform apply workload 
        steps: 
          - checkout: self 

          - bash: |
              set -e

              wget -O- https://apt.releases.hashicorp.com/gpg | \
                gpg --dearmor | \
                sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg > /dev/null

              echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | \
                sudo tee /etc/apt/sources.list.d/hashicorp.list

              sudo apt update
              sudo apt install -y terraform
            displayName: Install Terraform

          - download: current
            artifact: workload-plan
            displayName: Download workload plan

          - task: AzureCLI@2
            displayName: Terraform apply workload 
            inputs:
              azureSubscription: sc-cit-azure
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -e 

                cd infrastructure/workload

                terraform init

                terraform apply "$(Pipeline.Workspace)/workload-plan/tfplan"
