trigger:
  branches:
    include:
      - main
  
  paths:
    include:
      - infrastructure/platform/**
      - infrastructure/workload/**
      - pipelines/infrastructure-ci.yaml
    
pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - bash: |
      set -e

      wget -O- https://apt.releases.hashicorp.com/gpg | \
        gpg --dearmor | \
        sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg > /dev/null

      echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | \
        sudo tee /etc/apt/sources.list.d/hashicorp.list

      sudo apt update
      sudo apt install -y terraform
    displayName: Install Terraform

  - bash: |
      set -e 

      terraform fmt -check -recursive infrastructure/platform
      terraform fmt -check -recursive infrastructure/workload
    displayName: Check Terraform formatting

  - bash: |
      set -e 

      cd infrastructure/platform

      terraform init -backend=false
      terraform validate 
    displayName: Validate platform Terraform 

  - bash: |
      set -e 

      cd infrastructure/workload

      terraform init -backend=false
      terraform validate
    displayName: Validate workload Terraform 