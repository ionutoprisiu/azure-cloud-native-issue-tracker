trigger:
  branches:
    include:
      - main
  
  paths:
    include:
      - app/backend/**
      - pipelines/backend-cicd.yaml

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - bash: |
      cd app/backend
      docker build -t issue-tracker-backend:test .
    displayName: Build backend Docker image

  - bash: |
      set -e

      docker network create backend-test-net

      docker run -d \
        --name postgres-test \
        --network backend-test-net \
        -e POSTGRES_DB=issue_tracker \
        -e POSTGRES_USER=postgres \
        -e POSTGRES_PASSWORD=postgres \
        postgres:16

      until docker exec postgres-test \
        pg_isready -U postgres -d issue_tracker
      do
        sleep 2
      done

      docker run -d \
        --name backend-test \
        --network backend-test-net \
        -p 8000:8000 \
        -e POSTGRES_HOST=postgres-test \
        -e POSTGRES_PORT=5432 \
        -e POSTGRES_DB=issue_tracker \
        -e POSTGRES_USER=postgres \
        -e POSTGRES_PASSWORD=postgres \
        -e POSTGRES_SSLMODE=prefer \
        issue-tracker-backend:test

      sleep 5

      curl --fail http://localhost:8000/health

      docker rm -f backend-test postgres-test
    displayName: Test backend with PostgreSQL

  - task: AzureCLI@2
    displayName: Push backend image to ACR
    inputs:
      azureSubscription: sc-cit-azure
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -e

        az acr login --name crcitdevfrc

        docker tag \
          issue-tracker-backend:test \
          crcitdevfrc.azurecr.io/backend:latest

        docker push \
          crcitdevfrc.azurecr.io/backend:latest

  - task: AzureCLI@2
    displayName: Deploy backend to Container Apps
    inputs:
      azureSubscription: sc-cit-azure
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -e

        az containerapp update \
          --name ca-cit-backend-dev-frc-001 \
          --resource-group rg-cit-workload-dev-frc-001 \
          --image crcitdevfrc.azurecr.io/backend:latest \
          --revision-suffix build-$(Build.BuildId)

  - task: AzureCLI@2
    displayName: Verify deployed backend health
    inputs:
      azureSubscription: sc-cit-azure
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -e

        FQDN=$(az containerapp show \
          --name ca-cit-backend-dev-frc-001 \
          --resource-group rg-cit-workload-dev-frc-001 \
          --query properties.configuration.ingress.fqdn \
          --output tsv)

        echo "Checking https://$FQDN/health"

        curl --fail "https://$FQDN/health"